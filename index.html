<!doctype html>
<html lang="zh-CN">
<head>

  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; media-src 'self'; img-src data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>所有课程 · 英语听力练习</title>
  <style>
    :root{color-scheme:light dark;--bg:#f6f3ec;--surface:#fffdf8;--surface-2:#ece7dc;--text:#1f2d35;--muted:#67737a;--line:#d9d3c7;--accent:#277c71;--accent-2:#d9eee9;--warm:#b56b42;--shadow:0 18px 50px rgba(52,43,31,.08);--radius:22px;--focus:#146c94}
    @media(prefers-color-scheme:dark){:root{--bg:#151b1d;--surface:#1d2629;--surface-2:#283236;--text:#edf3f1;--muted:#aab7b5;--line:#3b484b;--accent:#72c7b9;--accent-2:#183d39;--warm:#e4a27c;--shadow:none;--focus:#8bd5ff}}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;line-height:1.55}button,a,input{font:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.app{width:min(1280px,100%);margin:0 auto;padding:clamp(26px,4vw,44px) clamp(16px,4vw,42px) 140px}
    .hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:clamp(24px,5vw,64px);align-items:center;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:clamp(2.15rem,5vw,3.4rem);line-height:1.05;letter-spacing:-.04em}.hero p{max-width:620px;margin:0;color:var(--muted);font-size:clamp(.98rem,2vw,1.12rem)}.latest-link{display:grid;grid-template-columns:1fr auto;gap:5px 16px;padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}.latest-link:hover{transform:translateY(-2px);border-color:var(--accent)}.latest-link span{color:var(--accent);font-size:.82rem;font-weight:800}.latest-link strong{grid-column:2;grid-row:1 / 3;color:var(--accent);font-size:1.15rem;align-self:center}.latest-link small{grid-column:1;color:var(--text);font-size:.95rem;font-weight:750}.latest-link.unavailable{display:block;color:var(--muted);box-shadow:none}
    .controls{position:sticky;top:0;z-index:10;margin-inline:calc(clamp(16px,4vw,42px) * -1);padding:11px clamp(16px,4vw,42px);border-block:1px solid color-mix(in srgb,var(--line) 75%,transparent);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px)}.controls-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;max-width:1196px;margin:0 auto}.filter-groups{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.filter-group{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:13px;background:var(--surface)}.filter-button,.cycle-button{min-height:38px;padding:6px 12px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:750;cursor:pointer}.filter-button.selected,.cycle-button.selected{background:var(--accent-2);color:var(--accent)}.cycle-tabs{display:flex;gap:5px;overflow:auto;max-width:48%;scrollbar-width:thin}.summary{margin:24px 0 16px;display:flex;align-items:end;justify-content:space-between;gap:18px}.summary h2{margin:0;font-size:clamp(1.45rem,3vw,1.9rem)}.summary strong{color:var(--accent);font-variant-numeric:tabular-nums}
    .course-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.course-card{min-height:174px}.course-panel{height:100%;display:flex;flex-direction:column;padding:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text);box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease}.course-panel.playing{border-color:var(--accent);background:color-mix(in srgb,var(--accent-2) 45%,var(--surface))}.course-disabled{height:100%;display:flex;flex-direction:column;padding:18px;border:1px dashed var(--line);border-radius:var(--radius);background:color-mix(in srgb,var(--surface) 58%,var(--bg));color:var(--muted)}.card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.day{color:var(--accent);font-weight:850;letter-spacing:.04em}.kind{font-size:.8rem;color:var(--muted);font-weight:750}.course-card h3{margin:20px 0 18px;font-size:1.12rem;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.86rem}.card-actions{display:flex;align-items:center;gap:7px}.preview-button,.course-open{min-height:38px;display:inline-flex;align-items:center;justify-content:center;padding:6px 11px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--accent);font-weight:800;text-decoration:none;cursor:pointer}.preview-button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}.course-open{padding-inline:10px}.missing{color:var(--warm);font-weight:800}.course-card[hidden]{display:none}.empty{display:none;margin:28px 0;padding:26px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);text-align:center}.empty.visible{display:block}
    .mini-player{position:fixed;z-index:30;left:50%;bottom:max(14px,env(safe-area-inset-bottom));width:min(920px,calc(100% - 28px));transform:translateX(-50%);display:grid;grid-template-columns:minmax(150px,1fr) auto minmax(180px,2fr) auto auto auto;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:19px;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:0 20px 55px rgba(31,45,53,.18);backdrop-filter:blur(18px)}.mini-player[hidden]{display:none}.player-info{min-width:0;display:grid;gap:1px}.player-info strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player-info span,.player-time{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}.player-toggle,.player-close{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--accent);font-weight:900;cursor:pointer}.player-toggle{background:var(--accent);border-color:var(--accent);color:#fff}.player-seek{width:100%;accent-color:var(--accent);cursor:pointer}.player-open{min-height:42px;display:inline-flex;align-items:center;padding:7px 13px;border-radius:12px;background:var(--accent-2);color:var(--accent);font-weight:800;text-decoration:none;white-space:nowrap}
    @media(max-width:1050px){.course-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:780px){.hero{grid-template-columns:1fr}.controls-inner{align-items:flex-start;flex-direction:column}.cycle-tabs{max-width:100%}.course-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mini-player{grid-template-columns:minmax(120px,1fr) auto minmax(150px,2fr) auto auto}.player-time{grid-column:3}.player-open{grid-column:4;grid-row:1 / 3}.player-close{grid-column:5;grid-row:1 / 3}}
    @media(max-width:560px){.app{padding-top:26px;padding-bottom:190px}.course-grid{grid-template-columns:1fr}.course-card{min-height:158px}.course-card h3{margin-block:17px}.filter-groups{width:100%}.filter-group{flex:1}.filter-button{flex:1;padding-inline:8px}.controls{top:0}.hero h1{font-size:2.25rem}.mini-player{grid-template-columns:minmax(0,1fr) auto auto;gap:9px}.player-info{grid-column:1}.player-toggle{grid-column:2}.player-close{grid-column:3}.player-seek{grid-column:1 / 4;grid-row:2}.player-time{grid-column:1;grid-row:3}.player-open{grid-column:2 / 4;grid-row:3;justify-self:end;min-height:38px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.course-link,.latest-link{transition:none}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div><h1>英语听力练习</h1><p>40 个高频生活与工作场景</p></div>
      <a class="latest-link" href="day-013-life-dialogue.html"><span>最新课程</span><strong>Day 013</strong><small>商品退换</small></a>
    </header>
    <nav class="controls" aria-label="课程筛选"><div class="controls-inner">
      <div class="filter-groups">
        <div class="filter-group" aria-label="场景"><button class="filter-button selected" type="button" data-filter="domain" data-value="all" aria-pressed="true">全部</button><button class="filter-button" type="button" data-filter="domain" data-value="life" aria-pressed="false">生活</button><button class="filter-button" type="button" data-filter="domain" data-value="work" aria-pressed="false">工作</button></div>
      </div>
      <div class="cycle-tabs" id="cycle-tabs" aria-label="课程循环"></div>
    </div></nav>
    <section class="summary" aria-live="polite"><h2 id="cycle-title"></h2><strong id="cycle-progress"></strong></section>
    <main><div class="course-grid" id="course-grid"></div><div class="empty" id="empty">当前筛选下没有课程</div></main>
  </div>
  <aside class="mini-player" id="mini-player" aria-label="课程试听播放器" hidden>
    <div class="player-info"><span id="player-day"></span><strong id="player-title"></strong></div>
    <button class="player-toggle" id="player-toggle" type="button" aria-label="播放试听">▶</button>
    <input class="player-seek" id="player-seek" type="range" min="0" max="1" step="0.05" value="0" aria-label="调整试听位置">
    <span class="player-time" id="player-time">0:00 / 0:00</span>
    <a class="player-open" id="player-open" href="#">进入课程</a>
    <button class="player-close" id="player-close" type="button" aria-label="关闭试听">×</button>
    <audio id="preview-audio" preload="metadata"></audio>
  </aside>
  <script>
  (()=>{
    'use strict';
    const DATA={"cycleLength":40,"defaultCycle":1,"cycles":[{"cycle":1,"generatedCount":13,"cards":[{"day":1,"domain":"life","format":"dialogue","indexTitleZh":"初次见面","status":"available","outputFileName":"day-001-life-dialogue.html","previewAudioFile":"previews/day-001-life-dialogue.mp3","audioDurationSeconds":35.1},{"day":2,"domain":"work","format":"monologue","indexTitleZh":"进度汇报","status":"available","outputFileName":"day-002-work-monologue.html","previewAudioFile":"previews/day-002-work-monologue.mp3","audioDurationSeconds":36.5},{"day":3,"domain":"work","format":"dialogue","indexTitleZh":"澄清需求","status":"available","outputFileName":"day-003-work-dialogue.html","previewAudioFile":"previews/day-003-work-dialogue.mp3","audioDurationSeconds":46.0},{"day":4,"domain":"life","format":"monologue","indexTitleZh":"见面改期","status":"available","outputFileName":"day-004-life-monologue.html","previewAudioFile":"previews/day-004-life-monologue.mp3","audioDurationSeconds":39.1},{"day":5,"domain":"life","format":"dialogue","indexTitleZh":"请求重复","status":"available","outputFileName":"day-005-life-dialogue.html","previewAudioFile":"previews/day-005-life-dialogue.mp3","audioDurationSeconds":36.4},{"day":6,"domain":"work","format":"monologue","indexTitleZh":"会议预告","status":"available","outputFileName":"day-006-work-monologue.html","previewAudioFile":"previews/day-006-work-monologue.mp3","audioDurationSeconds":42.1},{"day":7,"domain":"work","format":"dialogue","indexTitleZh":"确认优先级","status":"available","outputFileName":"day-007-work-dialogue.html","previewAudioFile":"previews/day-007-work-dialogue.mp3","audioDurationSeconds":48.1},{"day":8,"domain":"life","format":"monologue","indexTitleZh":"交通延误","status":"available","outputFileName":"day-008-life-monologue.html","previewAudioFile":"previews/day-008-life-monologue.mp3","audioDurationSeconds":45.6},{"day":9,"domain":"life","format":"dialogue","indexTitleZh":"个性化点餐","status":"available","outputFileName":"day-009-life-dialogue.html","previewAudioFile":"previews/day-009-life-dialogue.mp3","audioDurationSeconds":40.7},{"day":10,"domain":"work","format":"monologue","indexTitleZh":"工作流程","status":"available","outputFileName":"day-010-work-monologue.html","previewAudioFile":"previews/day-010-work-monologue.mp3","audioDurationSeconds":46.1},{"day":11,"domain":"work","format":"dialogue","indexTitleZh":"会议改期","status":"available","outputFileName":"day-011-work-dialogue.html","previewAudioFile":"previews/day-011-work-dialogue.mp3","audioDurationSeconds":39.9},{"day":12,"domain":"life","format":"monologue","indexTitleZh":"营业通知","status":"available","outputFileName":"day-012-life-monologue.html","previewAudioFile":"previews/day-012-life-monologue.mp3","audioDurationSeconds":37.3},{"day":13,"domain":"life","format":"dialogue","indexTitleZh":"商品退换","status":"available","outputFileName":"day-013-life-dialogue.html","previewAudioFile":"previews/day-013-life-dialogue.mp3","audioDurationSeconds":35.2},{"day":14,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":15,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":16,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":17,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":18,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":19,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":20,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":21,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":22,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":23,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":24,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":25,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":26,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":27,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":28,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":29,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":30,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":31,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":32,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":33,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":34,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":35,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":36,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":37,"domain":"life","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":38,"domain":"work","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":39,"domain":"work","format":"dialogue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null},{"day":40,"domain":"life","format":"monologue","indexTitleZh":null,"status":"pending","outputFileName":null,"previewAudioFile":null,"audioDurationSeconds":null}]}],"latestAvailable":{"day":13,"outputFileName":"day-013-life-dialogue.html","indexTitleZh":"商品退换"}};
    const labels={life:'生活',work:'工作',dialogue:'对话',monologue:'独白'};
    const state={cycle:DATA.defaultCycle,domain:'all'};
    const tabs=document.getElementById('cycle-tabs');
    const grid=document.getElementById('course-grid');
    const empty=document.getElementById('empty');
    const player=document.getElementById('mini-player');
    const previewAudio=document.getElementById('preview-audio');
    const playerToggle=document.getElementById('player-toggle');
    const playerSeek=document.getElementById('player-seek');
    const playerTime=document.getElementById('player-time');
    const playerOpen=document.getElementById('player-open');
    let currentPreview=null;
    function cycleData(){return DATA.cycles.find(item=>item.cycle===state.cycle)}
    function durationLabel(value){if(value===null)return '';const seconds=Math.round(value);return `约 ${seconds} 秒`}
    function formatTime(value){if(!Number.isFinite(value))return '0:00';const seconds=Math.max(0,Math.floor(value));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
    function updatePreviewButtons(){document.querySelectorAll('[data-preview-day]').forEach(button=>{const active=currentPreview&&Number(button.dataset.previewDay)===currentPreview.day;const playing=active&&!previewAudio.paused;button.textContent=playing?'暂停':'试听';button.setAttribute('aria-pressed',String(playing));button.closest('.course-panel')?.classList.toggle('playing',Boolean(active))});playerToggle.textContent=previewAudio.paused?'▶':'Ⅱ';playerToggle.setAttribute('aria-label',previewAudio.paused?'播放试听':'暂停试听')}
    function updatePlayerTime(){const duration=Number.isFinite(previewAudio.duration)?previewAudio.duration:0;playerSeek.max=String(duration||1);playerSeek.value=String(Math.min(previewAudio.currentTime,duration||1));playerTime.textContent=`${formatTime(previewAudio.currentTime)} / ${formatTime(duration)}`}
    function playPreview(card){if(!card.previewAudioFile)return;if(currentPreview&&currentPreview.day===card.day){if(previewAudio.paused)previewAudio.play().catch(updatePreviewButtons);else previewAudio.pause();return}previewAudio.pause();currentPreview=card;previewAudio.src=card.previewAudioFile;previewAudio.playbackRate=1;document.getElementById('player-day').textContent=`Day ${String(card.day).padStart(3,'0')}`;document.getElementById('player-title').textContent=card.indexTitleZh;playerOpen.href=card.outputFileName;player.hidden=false;previewAudio.play().catch(updatePreviewButtons);updatePreviewButtons()}
    function closePreview(){previewAudio.pause();previewAudio.removeAttribute('src');previewAudio.load();currentPreview=null;player.hidden=true;playerSeek.value='0';updatePreviewButtons()}
    function cardNode(card){
      const wrapper=document.createElement('article');wrapper.className='course-card';wrapper.dataset.domain=card.domain;wrapper.dataset.format=card.format;
      const content=document.createElement('div');content.className=card.status==='available'?'course-panel':'course-disabled';
      const top=document.createElement('div');top.className='card-top';top.innerHTML=`<span class="day">Day ${String(card.day).padStart(3,'0')}</span><span class="kind">${labels[card.domain]} · ${labels[card.format]}</span>`;
      const footer=document.createElement('div');footer.className='card-footer';
      if(card.status==='available'){
        footer.innerHTML=`<span>${durationLabel(card.audioDurationSeconds)}</span>`;
        const actions=document.createElement('div');actions.className='card-actions';
        if(card.previewAudioFile){const preview=document.createElement('button');preview.type='button';preview.className='preview-button';preview.dataset.previewDay=String(card.day);preview.setAttribute('aria-pressed','false');preview.textContent='试听';preview.addEventListener('click',()=>playPreview(card));actions.appendChild(preview)}
        const open=document.createElement('a');open.className='course-open';open.href=card.outputFileName;open.textContent='进入课程';actions.appendChild(open);footer.appendChild(actions);
      }else if(card.status==='missing')footer.innerHTML='<span class="missing">课程文件缺失</span><span>暂不可用</span>';
      else footer.innerHTML='<span>待生成</span><span>尚未开放</span>';
      content.appendChild(top);if(card.indexTitleZh){const title=document.createElement('h3');title.textContent=card.indexTitleZh;content.appendChild(title)}content.appendChild(footer);wrapper.appendChild(content);return wrapper;
    }
    function renderTabs(){tabs.innerHTML='';DATA.cycles.forEach(item=>{const button=document.createElement('button');button.type='button';button.className='cycle-button'+(item.cycle===state.cycle?' selected':'');button.textContent=`第 ${item.cycle} 轮`;button.setAttribute('aria-pressed',String(item.cycle===state.cycle));button.addEventListener('click',()=>{state.cycle=item.cycle;render()});tabs.appendChild(button)})}
    function renderCards(){const cycle=cycleData();grid.innerHTML='';let visible=0;cycle.cards.forEach(card=>{const node=cardNode(card);const show=state.domain==='all'||card.domain===state.domain;node.hidden=!show;if(show)visible+=1;grid.appendChild(node)});empty.classList.toggle('visible',visible===0);document.getElementById('cycle-title').textContent=`第 ${cycle.cycle} 轮课程`;document.getElementById('cycle-progress').textContent=`已生成 ${cycle.generatedCount} / ${DATA.cycleLength}`;updatePreviewButtons()}
    function render(){renderTabs();renderCards()}
    document.querySelectorAll('.filter-button').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.filter;state[key]=button.dataset.value;document.querySelectorAll(`[data-filter="${key}"]`).forEach(item=>{const selected=item===button;item.classList.toggle('selected',selected);item.setAttribute('aria-pressed',String(selected))});renderCards()}));
    playerToggle.addEventListener('click',()=>{if(!currentPreview)return;if(previewAudio.paused)previewAudio.play().catch(updatePreviewButtons);else previewAudio.pause()});
    playerSeek.addEventListener('input',()=>{if(Number.isFinite(previewAudio.duration))previewAudio.currentTime=Number(playerSeek.value)});
    document.getElementById('player-close').addEventListener('click',closePreview);
    previewAudio.addEventListener('loadedmetadata',updatePlayerTime);previewAudio.addEventListener('timeupdate',updatePlayerTime);previewAudio.addEventListener('play',updatePreviewButtons);previewAudio.addEventListener('pause',updatePreviewButtons);previewAudio.addEventListener('ended',updatePreviewButtons);
    render();
  })();
  </script>
</body>
</html>
